<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Treasure Hunt</title>
<style>
:root{--bg:#0c0820;--ink:#f1ecff;--acc:#c77dff;--gold:#ffd166;--mut:#a89fc4}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:10px/1.9 'Press Start 2P',ui-monospace,monospace;-webkit-font-smoothing:none;display:flex;align-items:center;justify-content:center;padding:16px}
main{display:grid;gap:14px;justify-items:center;text-align:center;width:min(100%,420px)}
h1{margin:0;font-size:16px;line-height:1.5;color:var(--gold);text-shadow:3px 3px 0 #5b2a86}
p{margin:0;color:var(--mut)}
#date{color:var(--ink)}
.how{width:100%;padding:12px 14px;text-align:left;background:#1a1334;box-shadow:0 -3px 0 #f1ecff,0 3px 0 #f1ecff,-3px 0 0 #f1ecff,3px 0 0 #f1ecff}
.how h2{margin:0 0 8px;color:var(--gold);font-size:10px;font-weight:400}
.how p{font-size:9px;line-height:1.8}
.how p+p{margin-top:5px}
button{font:inherit;font-size:12px;color:#fff;background:var(--acc);border:0;margin:3px;padding:12px 22px;cursor:pointer;box-shadow:0 -3px 0 #fff,0 3px 0 #fff,-3px 0 0 #fff,3px 0 0 #fff,inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.3)}
button:active{transform:translateY(3px)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:6px}
#hi{min-height:16px}
</style></head>
<body><main>
<h1>Pixel Treasure Hunt</h1>
<p id="description">Dig up letters by lantern light and guess today&rsquo;s word.</p>
<section id="how" class="how" aria-labelledby="how-title">
<h2 id="how-title">How to play</h2>
<p>Explore the map and stand beside objects to dig up hidden letters.</p>
<p>Use the letters to guess the word. Traps and wrong guesses cost lives.</p>
<p>Need help? A hint marks a hidden letter for 8 coins.</p>
</section>
<p id="date"></p>
<button id="play" type="button">Play</button>
<p id="hi"></p>
</main>
<script type="module" src="./splash.ts"></script>
</body></html>
