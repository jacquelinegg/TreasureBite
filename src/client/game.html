*{box-sizing:border-box}
html,body{margin:0}

#app{max-width:640px;margin:0 auto;padding:12px;display:grid;gap:12px}
h1{font-size:13px;margin:0}

.chips span{border:3px solid var(--line);background:var(--card);padding:4px 8px;margin-left:6px;white-space:nowrap}
.card{background:var(--card);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:10px}
canvas{width:100%;height:auto;image-rendering:pixelated;display:block}

.gr{display:flex;gap:8px}

.win{color:var(--ok)}.lose{color:var(--bad)}

.pic{width:144px;max-width:100%;margin:0 auto 8px}.pop{animation:pp .5s steps(5)}@keyframes pp{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.alb{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.alb canvas{width:40px;height:40px;border:2px solid var(--line)}.alb canvas.lk{filter:brightness(0);opacity:.3}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
#app{display:block;max-width:none;margin:0;padding:0;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));position:relative}

#hud{position:absolute;left:0;right:0;top:0;bottom:0;display:grid;grid-template-columns:64px minmax(0,1fr) max-content;align-content:start;align-items:start;gap:8px;padding:6px max(8px,env(safe-area-inset-left));color:#fff;--line:#fff;pointer-events:none}

#tb{position:absolute;z-index:11;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-content:center;gap:6px;padding:6px max(8px,env(safe-area-inset-left));box-sizing:border-box}

#pop button{border:0;margin:3px;box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),inset -3px -3px 0 0 rgba(0,0,0,.22),inset 3px 3px 0 0 rgba(255,255,255,.28)}

.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
.itm{border:3px solid var(--rc,#8a8a99);background:var(--card);padding:6px;display:grid;gap:5px;justify-items:center;text-align:center;box-shadow:3px 3px 0 var(--rc,#8a8a99);font-size:9px}

.sk{display:flex;align-items:center;gap:10px;margin-top:10px}
.sk span{flex:1}
